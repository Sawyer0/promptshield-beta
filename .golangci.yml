version: "2"

run:
  timeout: 5m

linters:
  # standard set: errcheck, govet, ineffassign, staticcheck, unused
  default: standard
  settings:
    staticcheck:
      checks:
        - all
        # Stylistic quick-fix and naming suggestions; not correctness issues.
        - -QF*
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
  exclusions:
    presets:
      - std-error-handling
      - common-false-positives
    rules:
      # Tests may ignore errors from cleanup and best-effort calls.
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
