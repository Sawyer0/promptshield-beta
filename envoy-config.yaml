static_resources:
  listeners:
  - name: main_listener
    address:
      socket_address: { address: 0.0.0.0, port_value: 8080 }
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ingress_http
          route_config:
            name: local_route
            virtual_hosts:
            - name: backend
              domains: ["*"]
              routes:
              - match: { prefix: "/v1/chat/completions" }
                route: 
                  cluster: openai_cluster
                  host_rewrite_literal: api.openai.com
              - match: { prefix: "/" }
                route: { cluster: backend_cluster }
          http_filters:
          # Fast header-based authZ before streaming inspection
          - name: envoy.filters.http.ext_authz
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
              transport_api_version: V3
              failure_mode_allow: false
              clear_route_cache: true
              status_on_error:
                code: FORBIDDEN
              http_service:
                server_uri:
                  uri: http://ps-enforcer:9090
                  cluster: ps_enforcer_http
                  timeout: 1.000s
                path_prefix: "/check"
                authorization_request:
                  allowed_headers:
                    patterns:
                      - exact: authorization
                      - exact: x-ps-token
                      - exact: x-tenant-id
                      - exact: x-request-id
                authorization_response:
                  allowed_upstream_headers:
                    patterns:
                      - exact: x-ps-decision
                      - exact: x-ps-reason
                      - exact: x-promptshield-license
          # Body inspection via ext_proc
          - name: envoy.filters.http.ext_proc
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
              grpc_service:
                google_grpc:
                  target_uri: ps-enforcer:9091
                  stat_prefix: ps_ext_proc
              message_timeout: 5.000s
              failure_mode_allow: false
              processing_mode:
                request_header_mode: SEND
                request_body_mode: STREAMED
                request_trailer_mode: SKIP
                response_header_mode: SEND
                response_body_mode: STREAMED
                response_trailer_mode: SKIP
          # Basic local rate limiting (edge DDoS guard). Relaxed/high ceiling for load tests.
          - name: envoy.filters.http.local_ratelimit
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
              stat_prefix: edge_lrl
              token_bucket:
                max_tokens: 1000000
                tokens_per_fill: 1000000
                fill_interval: 1s
              filter_enabled:
                runtime_key: local_rate_limit_enabled
                default_value: { numerator: 0, denominator: HUNDRED }
              filter_enforced:
                runtime_key: local_rate_limit_enforced
                default_value: { numerator: 0, denominator: HUNDRED }
              response_headers_to_add:
                - header: { key: "x-rate-limited", value: "true" }
                  append_action: APPEND_IF_EXISTS_OR_ADD
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
  - name: backend_cluster
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: backend_cluster
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address: { address: backend, port_value: 8080 }

  - name: promptshield_grpc
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config:
          http2_protocol_options: {}
    load_assignment:
      cluster_name: promptshield_grpc
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address: { address: ps-enforcer, port_value: 9091 }

  - name: ps_enforcer_http
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: ps_enforcer_http
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address: { address: ps-enforcer, port_value: 9090 }

  - name: openai_cluster
    connect_timeout: 30s
    type: LOGICAL_DNS
    dns_lookup_family: V4_ONLY
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: openai_cluster
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address: { address: api.openai.com, port_value: 443 }
    transport_socket:
      name: envoy.transport_sockets.tls
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
        sni: api.openai.com

admin:
  access_log_path: /dev/null
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }

