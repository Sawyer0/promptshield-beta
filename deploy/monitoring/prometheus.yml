global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yaml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'promptshield'
    static_configs:
      - targets: 
        - 'promptshield-1:9090'
        - 'promptshield-2:9090'
        - 'promptshield-3:9090'

  - job_name: 'envoy'
    static_configs:
      - targets:
        - 'envoy-1:9901'
        - 'envoy-2:9901'

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']