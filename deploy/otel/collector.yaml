receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  prometheus:
    config:
      scrape_configs:
        - job_name: 'promptshield'
          scrape_interval: 15s
          static_configs:
            - targets: ['promptshield:9090']

processors:
  batch: {}
  memory_limiter:
    check_interval: 5s
    limit_percentage: 75
    spike_limit_percentage: 25

exporters:
  logging:
    loglevel: info
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: otelcol
  otlp/tempo:
    endpoint: ${TEMPO_OTLP_ENDPOINT}
    tls:
      insecure: ${TEMPO_INSECURE:true}
      ca_file: ${TEMPO_CA_FILE}
  jaeger:
    endpoint: ${JAEGER_ENDPOINT}
    tls:
      insecure: ${JAEGER_INSECURE:true}
      ca_file: ${JAEGER_CA_FILE}

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [logging, otlp/tempo, jaeger]
    metrics:
      receivers: [otlp, prometheus]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [logging]

