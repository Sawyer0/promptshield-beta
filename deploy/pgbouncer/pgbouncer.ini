[databases]
# Supabase database pool configuration
# Format: dbname = host=<supabase-host> port=5432 dbname=<actual-db> 
promptshield = host=${SUPABASE_HOST} port=5432 dbname=postgres

# Connection pool for read replicas (if available)
promptshield_read = host=${SUPABASE_READ_HOST:-${SUPABASE_HOST}} port=5432 dbname=postgres

[pgbouncer]
# Connection pool mode
# session = connection returned to pool after client disconnects (default)
# transaction = connection returned after transaction ends (recommended for web apps)
# statement = connection returned after each statement (for prepared statements)
pool_mode = transaction

# Maximum number of client connections allowed
max_client_conn = 1000

# Default pool size per user/database combination
default_pool_size = 25

# Maximum pool size per database
max_db_connections = 100

# Reserve pool for super users
reserve_pool_size = 5
reserve_pool_timeout = 3

# How many additional connections to allow when pool is full
max_overflow = 50

# Server connection settings
server_lifetime = 3600
server_idle_timeout = 600
server_connect_timeout = 15
server_login_retry = 15

# Client connection settings
client_login_timeout = 60
client_idle_timeout = 0

# Query wait timeout when no connections available
query_wait_timeout = 120
query_timeout = 0

# Authentication
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

# Logging
logfile = /var/log/pgbouncer/pgbouncer.log
pidfile = /var/run/pgbouncer/pgbouncer.pid

# Admin access (for monitoring)
admin_users = pgbouncer, postgres
stats_users = pgbouncer, monitor

# Listen addresses
listen_addr = *
listen_port = 6432

# Unix socket (optional)
unix_socket_dir = /var/run/pgbouncer
unix_socket_mode = 0777

# TLS/SSL settings for Supabase connection
server_tls_sslmode = require
server_tls_protocols = secure
server_tls_ciphers = HIGH:MEDIUM:!3DES:!aNULL

# Client TLS (optional)
client_tls_sslmode = prefer

# Monitoring and maintenance
stats_period = 60
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1

# Performance tuning
tcp_keepalive = 1
tcp_keepcnt = 5
tcp_keepidle = 30
tcp_keepintvl = 10

# DNS settings
dns_max_ttl = 15
dns_nxdomain_ttl = 15

# Security
ignore_startup_parameters = extra_float_digits,options

# Connection limits per user
min_pool_size = 5
reserve_pool_timeout = 3

# Buffer sizes
pkt_buf = 4096
listen_backlog = 128
sbuf_loopcnt = 5

# Disable dangerous features
disable_pqexec = 0
application_name_add_host = 0