static_resources:
  listeners:
  - name: main_listener
    address:
      socket_address: { address: 0.0.0.0, port_value: 8080 }
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ingress_http
          codec_type: AUTO
          route_config:
            name: local_route
            virtual_hosts:
            - name: backend
              domains: ["*"]
              routes:
              # OpenAI API routing
              - match: { prefix: "/v1/chat/completions" }
                route: 
                  cluster: openai_cluster
                  host_rewrite_literal: api.openai.com
                  timeout: 300s
              # Anthropic API routing  
              - match: { prefix: "/v1/messages" }
                route:
                  cluster: anthropic_cluster
                  host_rewrite_literal: api.anthropic.com
                  timeout: 300s
              # Azure OpenAI routing
              - match: 
                  prefix: "/openai/deployments/"
                  headers:
                  - name: "api-key"
                    present_match: true
                route:
                  cluster: azure_openai_cluster
                  timeout: 300s
              # Default backend
              - match: { prefix: "/" }
                route: 
                  cluster: backend_cluster
                  timeout: 60s
          http_filters:
          # Extract tenant from header for routing
          - name: envoy.filters.http.header_to_metadata
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.header_to_metadata.v3.Config
              request_rules:
              - header: x-ps-tenant-id
                on_header_present:
                  metadata_namespace: envoy.lb
                  key: tenant_id
                  type: STRING
                remove: false
          
          # Fast header-based authZ before body inspection
          - name: envoy.filters.http.ext_authz
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
              transport_api_version: V3
              failure_mode_allow: false
              clear_route_cache: true
              status_on_error:
                code: 503
              http_service:
                server_uri:
                  uri: promptshield-cluster
                  cluster: ps_enforcer_http
                  timeout: 1s
                path_prefix: "/check"
                authorization_request:
                  allowed_headers:
                    patterns:
                      - exact: authorization
                      - exact: x-ps-token
                      - exact: x-ps-tenant-id
                      - exact: x-request-id
                      - exact: x-api-key
                      - exact: api-key
                authorization_response:
                  allowed_upstream_headers:
                    patterns:
                      - exact: x-ps-decision
                      - exact: x-ps-reason
                      - exact: x-ps-violations
                      - exact: x-promptshield-license
          
          # Body inspection via ext_proc
          - name: envoy.filters.http.ext_proc
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
              grpc_service:
                envoy_grpc:
                  cluster_name: ps_enforcer_grpc
                  authority: promptshield.local
              message_timeout: 5s
              failure_mode_allow: false
              async_mode: false
              processing_mode:
                request_header_mode: SEND
                request_body_mode: STREAMED
                request_trailer_mode: SKIP
                response_header_mode: SEND
                response_body_mode: STREAMED
                response_trailer_mode: SKIP
              metadata_options:
                forwarding_namespaces:
                  untyped:
                  - envoy.lb
          
          # Per-tenant rate limiting
          - name: envoy.filters.http.local_ratelimit
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
              stat_prefix: tenant_rl
              token_bucket:
                max_tokens: 1000
                tokens_per_fill: 1000
                fill_interval: 60s
              filter_enabled:
                runtime_key: local_rate_limit_enabled
                default_value:
                  numerator: 100
                  denominator: HUNDRED
              filter_enforced:
                runtime_key: local_rate_limit_enforced
                default_value:
                  numerator: 100
                  denominator: HUNDRED
              response_headers_to_add:
                - header:
                    key: "x-rate-limit-limit"
                    value: "1000"
                  append_action: OVERWRITE_IF_EXISTS_OR_ADD
                - header:
                    key: "x-rate-limited"
                    value: "true"
                  append_action: OVERWRITE_IF_EXISTS_OR_ADD
              local_rate_limit_per_downstream_connection: false
              enable_x_ratelimit_headers: DRAFT_VERSION_03
          
          # Router
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
  # PromptShield clusters with load balancing
  - name: ps_enforcer_http
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    health_checks:
    - timeout: 3s
      interval: 30s
      unhealthy_threshold: 3
      healthy_threshold: 2
      http_health_check:
        path: /healthz
        expected_statuses:
        - start: 200
          end: 299
    load_assignment:
      cluster_name: ps_enforcer_http
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address: { address: promptshield-1, port_value: 9090 }
        - endpoint:
            address:
              socket_address: { address: promptshield-2, port_value: 9090 }
        - endpoint:
            address:
              socket_address: { address: promptshield-3, port_value: 9090 }

  - name: ps_enforcer_grpc
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config:
          http2_protocol_options:
            max_concurrent_streams: 100
    health_checks:
    - timeout: 3s
      interval: 30s
      unhealthy_threshold: 3
      healthy_threshold: 2
      grpc_health_check: {}
    load_assignment:
      cluster_name: ps_enforcer_grpc
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address: { address: promptshield-1, port_value: 9091 }
        - endpoint:
            address:
              socket_address: { address: promptshield-2, port_value: 9091 }
        - endpoint:
            address:
              socket_address: { address: promptshield-3, port_value: 9091 }

  # LLM Provider clusters
  - name: openai_cluster
    connect_timeout: 30s
    type: LOGICAL_DNS
    dns_lookup_family: V4_ONLY
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: openai_cluster
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address: { address: api.openai.com, port_value: 443 }
    transport_socket:
      name: envoy.transport_sockets.tls
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
        sni: api.openai.com

  - name: anthropic_cluster
    connect_timeout: 30s
    type: LOGICAL_DNS
    dns_lookup_family: V4_ONLY
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: anthropic_cluster
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address: { address: api.anthropic.com, port_value: 443 }
    transport_socket:
      name: envoy.transport_sockets.tls
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
        sni: api.anthropic.com

  - name: azure_openai_cluster
    connect_timeout: 30s
    type: LOGICAL_DNS
    dns_lookup_family: V4_ONLY
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: azure_openai_cluster
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address: { address: "${AZURE_OPENAI_ENDPOINT}", port_value: 443 }
    transport_socket:
      name: envoy.transport_sockets.tls
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
        sni: "${AZURE_OPENAI_ENDPOINT}"

  # Fallback backend
  - name: backend_cluster
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: backend_cluster
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address: { address: backend, port_value: 8080 }

admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }