upstream promptshield_api {
    least_conn;
    
    # API servers - scale these based on load
    server promptshield-1:9090 max_fails=3 fail_timeout=30s;
    server promptshield-2:9090 max_fails=3 fail_timeout=30s;
    server promptshield-3:9090 max_fails=3 fail_timeout=30s;
    
    # Health check
    keepalive 32;
}

upstream promptshield_grpc {
    least_conn;
    
    # gRPC servers for ext_proc
    server promptshield-1:9091 max_fails=3 fail_timeout=30s;
    server promptshield-2:9091 max_fails=3 fail_timeout=30s;
    server promptshield-3:9091 max_fails=3 fail_timeout=30s;
}

upstream envoy_proxy {
    least_conn;
    
    # Envoy instances for enforcement
    server envoy-1:8080 max_fails=3 fail_timeout=30s;
    server envoy-2:8080 max_fails=3 fail_timeout=30s;
}

# Rate limiting zones
limit_req_zone $http_x_ps_tenant_id zone=tenant_limit:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=ip_limit:10m rate=50r/s;

# HTTP redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api.promptshield.com proxy.promptshield.com;
    
    # Allow ACME challenges for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS API Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.promptshield.com;
    
    # SSL Configuration
    ssl_certificate /etc/nginx/ssl/api.promptshield.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/api.promptshield.com/privkey.pem;
    
    # SSL Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    
    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/nginx/ssl/api.promptshield.com/chain.pem;
    
    # SSL Session Settings
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    
    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # CORS headers for frontend
    add_header 'Access-Control-Allow-Origin' '$http_origin' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Authorization, X-PS-Tenant-ID, X-PS-User-ID, X-PS-Frontend-Auth, Content-Type' always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;
    
    # Handle preflight requests
    if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Max-Age' 86400;
        add_header 'Content-Type' 'text/plain; charset=utf-8';
        add_header 'Content-Length' 0;
        return 204;
    }
    
    # Rate limiting per tenant
    limit_req zone=tenant_limit burst=200 nodelay;
    limit_req zone=ip_limit burst=100 nodelay;
    
    # Increase body size for rulepack uploads
    client_max_body_size 10M;
    
    # Timeouts for long-running operations
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    
    location / {
        proxy_pass http://promptshield_api;
        proxy_http_version 1.1;
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        
        # Pass through custom headers
        proxy_pass_header X-PS-Tenant-ID;
        proxy_pass_header X-PS-User-ID;
        proxy_pass_header X-PS-Frontend-Auth;
        
        # Buffering
        proxy_buffering off;
        proxy_request_buffering off;
    }
    
    # Health check endpoint (no rate limiting)
    location /healthz {
        limit_req off;
        proxy_pass http://promptshield_api/healthz;
    }
    
    # Metrics endpoint (internal only)
    location /metrics {
        allow 10.0.0.0/8;
        deny all;
        proxy_pass http://promptshield_api/metrics;
    }
}

# HTTPS Enforcement Proxy Server
server {
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;
    server_name proxy.promptshield.com;
    
    # SSL Configuration
    ssl_certificate /etc/nginx/ssl/proxy.promptshield.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/proxy.promptshield.com/privkey.pem;
    
    # SSL Security Settings (same as API)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/nginx/ssl/proxy.promptshield.com/chain.pem;
    
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSLProxy:10m;
    ssl_session_tickets off;
    
    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    
    # Increase limits for LLM traffic
    client_max_body_size 50M;
    client_body_buffer_size 1M;
    
    # Longer timeouts for LLM calls
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    
    # Rate limiting for enforcement
    limit_req zone=tenant_limit burst=50 nodelay;
    
    location / {
        proxy_pass http://envoy_proxy;
        proxy_http_version 1.1;
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Streaming support for LLM responses
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_set_header Connection "";
        chunked_transfer_encoding on;
        
        # Pass through auth headers
        proxy_pass_header Authorization;
        proxy_pass_header X-PS-Tenant-ID;
    }
}