# Production nginx config with TLS, HSTS, CSP, and secure proxying

# Redirect HTTP to HTTPS
server {
  listen 80;
  listen [::]:80;
  server_name app.example.com;
  return 301 https://$host$request_uri;
}

# HTTPS server
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name app.example.com;

  # TLS
  ssl_certificate     /etc/nginx/ssl/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         'TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256';
  ssl_prefer_server_ciphers off;
  ssl_session_timeout 1d;
  ssl_session_cache   shared:SSL:10m;

  # Security headers
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  # Content Security Policy (adjust 'connect-src' for Clerk API domains and your API if cross-origin)
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://api.clerk.com https://*.clerk.accounts; frame-ancestors 'none'; base-uri 'self'" always;

  # Larger bodies if needed
  client_max_body_size 10M;

  # Upstreams
  upstream promptshield_api {
    least_conn;
    server promptshield-1:9090 max_fails=3 fail_timeout=30s;
    server promptshield-2:9090 max_fails=3 fail_timeout=30s;
    server promptshield-3:9090 max_fails=3 fail_timeout=30s;
    keepalive 32;
  }

  # Proxy to BFF for UI and API (same-origin)
  location / {
    proxy_pass http://frontend-bff:8096;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering off;
  }

  # Optional: direct API access under same origin (if you want /v1/*)
  location /v1/ {
    proxy_pass http://promptshield_api/v1/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /healthz { return 200 'ok'; add_header Content-Type text/plain; }
}

