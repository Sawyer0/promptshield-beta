# Upstreams
resolver 127.0.0.11 ipv6=off valid=30s;

upstream promptshield_api {
    least_conn;
    server promptshield-1:9090 max_fails=3 fail_timeout=30s;
    server promptshield-2:9090 max_fails=3 fail_timeout=30s;
    server promptshield-3:9090 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream frontend_bff {
    zone bff 64k;
    server frontend-bff:8096 resolve;
}

# UI/BFF on port 3000
server {
    listen 3000;
    listen [::]:3000;
    server_name localhost;

    # UI (BFF)
    location / {
        proxy_pass http://frontend_bff;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Same-origin API proxy (optional convenience)
    location /v1/ {
        proxy_pass http://promptshield_api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# API on port 80 (optional direct access)
server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    client_max_body_size 10M;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    location /v1/ {
        proxy_pass http://promptshield_api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy all other routes (including Clerk handshake) to the frontend BFF
    location / {
        proxy_pass http://frontend_bff;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location = /healthz { return 200 'ok'; add_header Content-Type text/plain; }
}
