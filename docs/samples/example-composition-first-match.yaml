apiVersion: promptshield.io/v1
kind: RulePack
metadata:
  name: example-first-match
  version: 1.0.0
composition:
  strategy: first_match
rules:
  - id: fast-keyword
    name: Fast keyword gate
    level: 1
    severity: WARNING
    keywords: ["ignore previous"]
  - id: heavier-regex
    name: Heavier regex evaluated after keyword
    level: 2
    severity: WARNING
    patterns:
      - regex: "(?i)ignore\\s+previous\\s+instructions"

