apiVersion: promptshield.io/v1
kind: RulePack
metadata:
  name: pii-detection
  version: 1.0.0
  description: Comprehensive PII and sensitive data detection rules
  authors:
    - PromptShield Security Team
  tags:
    - privacy
    - pii
    - gdpr
    - compliance

rules:
  # Level 1: Direct PII keywords
  - id: pii-ssn-keywords
    name: Social Security Number indicators
    description: Detects SSN-related keywords
    level: 1
    severity: CRITICAL
    keywords:
      - "social security number"
      - "social security #"
      - "SSN"
      - "social sec"
      - "soc sec"
    response:
      action: flag
      message: "Potential SSN reference detected"

  - id: pii-financial-keywords
    name: Financial account indicators
    description: Detects financial account related keywords
    level: 1
    severity: HIGH
    keywords:
      - "bank account"
      - "routing number"
      - "account number"
      - "credit card"
      - "debit card"
      - "card number"
      - "CVV"
      - "expiry date"
      - "IBAN"
      - "SWIFT"
    response:
      action: warn
      message: "Financial information keywords detected"

  - id: pii-medical-keywords
    name: Medical information indicators
    description: Detects medical and health-related keywords
    level: 1
    severity: HIGH
    keywords:
      - "medical record"
      - "patient ID"
      - "diagnosis"
      - "prescription"
      - "health insurance"
      - "medical history"
      - "treatment plan"
      - "lab results"
    response:
      action: warn
      message: "Medical information keywords detected"

  # Level 2: Pattern-based PII detection
  - id: pii-ssn-pattern
    name: Social Security Number pattern
    description: Detects US SSN patterns (XXX-XX-XXXX)
    level: 2
    severity: CRITICAL
    patterns:
      - regex: "\\b(?!000|666|9\\d{2})\\d{3}[-\\s]?(?!00)\\d{2}[-\\s]?(?!0000)\\d{4}\\b"
      - regex: "\\b(?!000|666|9\\d{2})\\d{3}(?!00)\\d{2}(?!0000)\\d{4}\\b"
    response:
      action: block
      message: "Social Security Number pattern detected"

  - id: pii-credit-card-pattern
    name: Credit card number pattern
    description: Detects credit card number patterns with Luhn validation
    level: 2
    severity: CRITICAL
    patterns:
      # Visa
      - regex: "\\b4[0-9]{3}[-\\s]?[0-9]{4}[-\\s]?[0-9]{4}[-\\s]?[0-9]{4}\\b"
      # Mastercard
      - regex: "\\b5[1-5][0-9]{2}[-\\s]?[0-9]{4}[-\\s]?[0-9]{4}[-\\s]?[0-9]{4}\\b"
      # American Express
      - regex: "\\b3[47][0-9]{2}[-\\s]?[0-9]{6}[-\\s]?[0-9]{5}\\b"
      # Discover
      - regex: "\\b6(?:011|5[0-9]{2})[-\\s]?[0-9]{4}[-\\s]?[0-9]{4}[-\\s]?[0-9]{4}\\b"
    response:
      action: block
      message: "Credit card number pattern detected"

  - id: pii-email-pattern
    name: Email address pattern
    description: Detects email addresses
    level: 2
    severity: WARNING
    patterns:
      - regex: "\\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Z|a-z]{2,}\\b"
    response:
      action: flag
      message: "Email address detected"

  - id: pii-phone-pattern
    name: Phone number patterns
    description: Detects various phone number formats
    level: 2
    severity: WARNING
    patterns:
      # US phone numbers
      - regex: "\\b(?:\\+?1[-.]?)?\\(?[2-9]\\d{2}\\)?[-.]?\\d{3}[-.]?\\d{4}\\b"
      # International format
      - regex: "\\b\\+[1-9]\\d{1,14}\\b"
      # Generic 10-digit
      - regex: "\\b\\d{3}[-.]?\\d{3}[-.]?\\d{4}\\b"
    response:
      action: flag
      message: "Phone number pattern detected"

  - id: pii-ip-address-pattern
    name: IP address pattern
    description: Detects IPv4 and IPv6 addresses
    level: 2
    severity: LOW
    patterns:
      # IPv4
      - regex: "\\b(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\\.){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\\b"
      # IPv6
      - regex: "\\b(?:[0-9a-fA-F]{1,4}:){7}[0-9a-fA-F]{1,4}\\b"
    response:
      action: flag
      message: "IP address detected"

  - id: pii-passport-pattern
    name: Passport number patterns
    description: Detects various passport number formats
    level: 2
    severity: HIGH
    patterns:
      # US Passport
      - regex: "\\b[A-Z][0-9]{8}\\b"
      # UK Passport
      - regex: "\\b[0-9]{9}\\b"
      # Generic alphanumeric passport
      - regex: "\\b[A-Z]{1,2}[0-9]{6,9}\\b"
    when:
      - passport
      - travel_document
    response:
      action: warn
      message: "Potential passport number detected"

  - id: pii-drivers-license-pattern
    name: Driver's license patterns
    description: Detects driver's license numbers for various states
    level: 2
    severity: WARNING
    patterns:
      # California DL
      - regex: "\\b[A-Z][0-9]{7}\\b"
      # New York DL
      - regex: "\\b[0-9]{3}[-\\s]?[0-9]{3}[-\\s]?[0-9]{3}\\b"
      # Generic alphanumeric
      - regex: "\\b[A-Z]{1,2}[-\\s]?[0-9]{6,8}\\b"
    when:
      - drivers_license
      - identification
    response:
      action: warn
      message: "Potential driver's license number detected"

  - id: pii-date-of-birth
    name: Date of birth patterns
    description: Detects various date formats that could be DOB
    level: 2
    severity: WARNING
    patterns:
      # MM/DD/YYYY or MM-DD-YYYY
      - regex: "\\b(?:0[1-9]|1[0-2])[-/](?:0[1-9]|[12][0-9]|3[01])[-/](?:19|20)\\d{2}\\b"
      # DD/MM/YYYY or DD-MM-YYYY
      - regex: "\\b(?:0[1-9]|[12][0-9]|3[01])[-/](?:0[1-9]|1[0-2])[-/](?:19|20)\\d{2}\\b"
      # YYYY-MM-DD
      - regex: "\\b(?:19|20)\\d{2}[-/](?:0[1-9]|1[0-2])[-/](?:0[1-9]|[12][0-9]|3[01])\\b"
    when:
      - birth
      - dob
      - birthday
    response:
      action: flag
      message: "Date of birth pattern detected"

  # Level 3: Context-aware PII detection
  - id: pii-semantic-personal-info
    name: Contextual personal information detection
    description: Uses semantic analysis to detect PII in context
    level: 3
    severity: HIGH
    semantic:
      model: "gpt-4o-mini"
      analysis_prompt: |
        Analyze the following text for personally identifiable information (PII):
        1. Names (first, last, full names)
        2. Addresses (street, city, zip)
        3. Personal identifiers (SSN, passport, license numbers)
        4. Financial information (account numbers, card details)
        5. Medical information (diagnoses, medications, conditions)
        6. Contact information (email, phone, social media handles)
        
        Consider the context to determine if the information is:
        - Real PII that should be protected
        - Example/test data
        - Public information
        
        Text: {input}
        
        Respond VIOLATION if real PII is detected, SAFE otherwise.
        Include confidence score (0.0-1.0).
      confidence_threshold: 0.80
      fallback_on_error: true
    fallback:
      keywords: ["personal information", "private data"]
    response:
      action: warn
      message: "Personal information detected via semantic analysis"

  - id: pii-semantic-medical
    name: Medical information semantic detection
    description: Detects medical and health information using context
    level: 3
    severity: HIGH
    semantic:
      model: "gpt-4o-mini"
      analysis_prompt: |
        Analyze for protected health information (PHI) under HIPAA:
        1. Medical diagnoses or conditions
        2. Treatment information
        3. Prescription medications
        4. Lab results or medical tests
        5. Patient identifiers
        6. Healthcare provider information
        
        Text: {input}
        
        Respond VIOLATION if PHI is detected, SAFE otherwise.
      confidence_threshold: 0.75
      fallback_on_error: false
    response:
      action: block
      message: "Protected health information detected"

# Composition settings
composition:
  strategy: all_matches  # Check all rules for comprehensive PII detection
  
# Performance tuning
performance:
  buffer_bytes: 65536    # Larger buffer for document scanning
  chunk_overlap: 512
  per_rule_timeout: 150ms
  case_sensitive: false
  whole_word: false

# Context definitions for conditional rules
context:
  document_type: "general"
  sensitivity_level: "high"