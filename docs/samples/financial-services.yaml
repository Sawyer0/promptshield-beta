apiVersion: promptshield.io/v1
kind: RulePack
metadata:
  name: financial-services
  version: 1.0.0
  description: Financial services compliance and security rules (PCI-DSS, SOX, GLBA)
  authors:
    - PromptShield Security Team
  tags:
    - finance
    - banking
    - pci-dss
    - sox
    - glba
    - compliance

# Extends base PII detection with financial focus
extends:
  - path: ./pii-detection.yaml
    override:
      context:
        document_type: "financial"
        sensitivity_level: "critical"

rules:
  # Level 1: Financial terminology and keywords
  - id: fin-account-info
    name: Financial account information
    description: Detects financial account references
    level: 1
    severity: CRITICAL
    keywords:
      - "account balance"
      - "wire transfer"
      - "ACH transfer"
      - "SWIFT transfer"
      - "transaction history"
      - "account statement"
      - "overdraft"
      - "interest rate"
      - "APR"
      - "APY"
      - "loan number"
      - "mortgage number"
    response:
      action: warn
      message: "Financial account information detected"

  - id: fin-trading-info
    name: Trading and investment information
    description: Detects trading and investment data
    level: 1
    severity: HIGH
    keywords:
      - "portfolio"
      - "stock symbol"
      - "ticker"
      - "buy order"
      - "sell order"
      - "limit order"
      - "market order"
      - "trading strategy"
      - "insider information"
      - "material non-public"
      - "MNPI"
    response:
      action: warn
      message: "Trading/investment information detected"

  - id: fin-kyc-aml
    name: KYC and AML terminology
    description: Detects Know Your Customer and Anti-Money Laundering terms
    level: 1
    severity: HIGH
    keywords:
      - "know your customer"
      - "KYC"
      - "AML"
      - "anti-money laundering"
      - "suspicious activity"
      - "SAR"
      - "CTR"
      - "currency transaction"
      - "PEP"
      - "politically exposed"
      - "sanctions list"
      - "OFAC"
    response:
      action: flag
      message: "KYC/AML related information detected"

  # Level 2: Financial data patterns
  - id: fin-iban-pattern
    name: IBAN account number pattern
    description: Detects International Bank Account Numbers
    level: 2
    severity: CRITICAL
    patterns:
      - regex: "\\b[A-Z]{2}[0-9]{2}[A-Z0-9]{4}[0-9]{7}([A-Z0-9]?){0,16}\\b"
    response:
      action: block
      message: "IBAN account number detected"

  - id: fin-routing-number
    name: Bank routing number pattern
    description: Detects US bank routing numbers (ABA)
    level: 2
    severity: CRITICAL
    patterns:
      - regex: "\\b0[0-9]{8}\\b"  # Starts with 0
      - regex: "\\b1[0-2][0-9]{7}\\b"  # Starts with 10-12
      - regex: "\\b[2-3][0-9]{8}\\b"  # Starts with 2 or 3
    response:
      action: block
      message: "Bank routing number detected"

  - id: fin-swift-bic
    name: SWIFT/BIC code pattern
    description: Detects SWIFT/BIC codes
    level: 2
    severity: HIGH
    patterns:
      - regex: "\\b[A-Z]{6}[A-Z0-9]{2}([A-Z0-9]{3})?\\b"
    when:
      - swift
      - bic
      - transfer
    response:
      action: warn
      message: "SWIFT/BIC code detected"

  - id: fin-cryptocurrency
    name: Cryptocurrency wallet patterns
    description: Detects cryptocurrency wallet addresses
    level: 2
    severity: HIGH
    patterns:
      # Bitcoin
      - regex: "\\b[13][a-km-zA-HJ-NP-Z1-9]{25,34}\\b"
      - regex: "\\bbc1[a-z0-9]{39,59}\\b"
      # Ethereum
      - regex: "\\b0x[a-fA-F0-9]{40}\\b"
    response:
      action: warn
      message: "Cryptocurrency wallet address detected"

  - id: fin-tax-id-patterns
    name: Tax identification patterns
    description: Detects tax ID numbers (EIN, TIN)
    level: 2
    severity: HIGH
    patterns:
      # EIN format
      - regex: "\\b[0-9]{2}-[0-9]{7}\\b"
      # TIN format
      - regex: "\\bTIN[:#\\s-]?[0-9]{9}\\b"
        flags: [ignorecase]
    response:
      action: warn
      message: "Tax identification number detected"

  - id: fin-transaction-patterns
    name: Financial transaction patterns
    description: Detects transaction details and amounts
    level: 2
    severity: WARNING
    patterns:
      - regex: "\\$[0-9]{1,3}(?:,[0-9]{3})*(?:\\.[0-9]{2})?"
      - regex: "(?:USD|EUR|GBP|JPY|CHF)\\s*[0-9]+(?:\\.[0-9]{2})?"
      - regex: "(?i)(?:amount|balance|total)[:#\\s]+\\$?[0-9]+(?:\\.[0-9]{2})?"
        flags: [ignorecase]
    response:
      action: flag
      message: "Financial transaction amount detected"

  # Level 3: Context-aware financial analysis
  - id: fin-insider-trading
    name: Insider trading risk detection
    description: Detects potential insider trading discussions
    level: 3
    severity: CRITICAL
    semantic:
      model: "gpt-4o-mini"
      analysis_prompt: |
        Analyze for insider trading risks and material non-public information:
        1. Undisclosed earnings or financial results
        2. Pending mergers or acquisitions
        3. Unannounced product launches
        4. Executive changes not yet public
        5. Regulatory actions or investigations
        6. Trading tips based on insider knowledge
        
        This is critical for SEC compliance and legal liability.
        
        Text: {input}
        
        Respond VIOLATION if insider trading risk detected, SAFE otherwise.
        Include confidence score (0.0-1.0).
      confidence_threshold: 0.70
      fallback_on_error: true
    fallback:
      keywords: ["insider", "not public", "confidential", "before announcement"]
    response:
      action: block
      message: "Potential insider trading risk - escalate to compliance"

  - id: fin-fraud-detection
    name: Financial fraud pattern detection
    description: Detects potential fraud indicators
    level: 3
    severity: CRITICAL
    semantic:
      model: "gpt-4o-mini"
      analysis_prompt: |
        Analyze for financial fraud indicators:
        1. Account takeover attempts
        2. Identity theft patterns
        3. Money laundering schemes
        4. Check or wire fraud
        5. Credit card fraud patterns
        6. Phishing or social engineering
        
        Text: {input}
        
        Respond VIOLATION if fraud indicators detected, SAFE otherwise.
      confidence_threshold: 0.75
      fallback_on_error: true
    fallback:
      patterns:
        - regex: "(?i)(fake|stolen|fraudulent|unauthorized|scam)"
          flags: [ignorecase]
    response:
      action: block
      message: "Potential fraud indicators detected"

  - id: fin-regulatory-compliance
    name: Regulatory compliance checking
    description: Ensures compliance with financial regulations
    level: 3
    severity: HIGH
    semantic:
      model: "gpt-4o-mini"
      analysis_prompt: |
        Check for financial regulatory compliance issues:
        1. PCI-DSS violations (credit card data handling)
        2. SOX compliance (financial reporting accuracy)
        3. GLBA violations (customer information security)
        4. GDPR/CCPA violations (data privacy)
        5. Basel III requirements (risk management)
        6. Dodd-Frank compliance
        
        Text: {input}
        
        Respond VIOLATION if compliance issues detected, SAFE otherwise.
      confidence_threshold: 0.80
      fallback_on_error: false
    response:
      action: warn
      message: "Regulatory compliance review required"

  - id: fin-investment-advice
    name: Unauthorized investment advice
    description: Detects unauthorized financial advice
    level: 3
    severity: HIGH
    semantic:
      model: "gpt-4o-mini"
      analysis_prompt: |
        Detect unauthorized investment advice or recommendations:
        1. Specific stock or fund recommendations
        2. Trading strategies without disclaimers
        3. Guaranteed returns or promises
        4. Financial planning without credentials
        5. Tax advice without qualification
        
        Text: {input}
        
        Respond VIOLATION if unauthorized advice detected, SAFE otherwise.
      confidence_threshold: 0.70
      fallback_on_error: true
    fallback:
      keywords: ["guaranteed return", "hot tip", "can't lose", "sure thing"]
    response:
      action: warn
      message: "Potential unauthorized financial advice detected"

# Composition settings
composition:
  strategy: all_matches  # Comprehensive financial compliance checking
  
# Performance tuning
performance:
  buffer_bytes: 65536    # Larger for financial documents
  chunk_overlap: 512
  per_rule_timeout: 150ms
  case_sensitive: false
  whole_word: false

# Financial services context
context:
  industry: "financial_services"
  compliance_frameworks: ["PCI-DSS", "SOX", "GLBA"]
  data_classification: "confidential"
  require_encryption: true
  require_audit_log: true
  transaction_monitoring: true


