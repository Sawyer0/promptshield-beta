apiVersion: promptshield.io/v1
kind: RulePack
metadata:
  name: pii-secrets-protection
  version: 1.0.0
rules:
  - id: credit-card
    level: 2
    severity: HIGH
    patterns:
      - regex: "\b(?:\d[ -]*?){13,16}\b"

  - id: ssn
    level: 2
    severity: CRITICAL
    patterns:
      - regex: "\b\d{3}-\d{2}-\d{4}\b"

  - id: api-key-generic
    level: 2
    severity: HIGH
    patterns:
      - regex: "(?i)(api[_-]?key|token)[\s:=]+['\"]?([a-zA-Z0-9]{32,})['\"]?"

  - id: response-llm-hallucination
    level: 3
    severity: HIGH
    semantic:
      analysis_prompt: "Detect hallucinated claims or instructions that expose sensitive data."
      confidence_threshold: 0.7
      fallback_on_error: true


