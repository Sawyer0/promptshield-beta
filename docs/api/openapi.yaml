openapi: 3.0.3
info:
  title: PromptShield Gateway HTTP API
  version: 0.2.0
  description: |
    HTTP surface of the PromptShield enforcer (ps-enforcer, default :9090) for health,
    decisions, configuration, rulepack lifecycle, async jobs and observability. Versioned
    endpoints are under /v1. The server root also serves /healthz, /readyz, /metrics
    (when metrics are enabled) and POST /check, plus /check/* for Envoy ext_authz
    path_prefix forwarding.

    Decision endpoints (/v1/check, /v1/scan) require a token only when
    PS_ENFORCER_AUTH_TOKEN is set. Admin endpoints require PS_ENFORCER_ADMIN_TOKEN, sent
    as a bearer token or X-PS-Admin-Token; with no admin token configured they answer 401
    unless insecure admin access is enabled.

    Tenant, assignment, audit and system admin routes wrap their payload as
    {"data": ..., "meta": ...}. Not covered here: the /v1/debug/* endpoints and the
    /v1/admin/policies routes, which exist only when a policy service is configured.
servers:
  - url: http://localhost:9090
    description: Local development
paths:
  /healthz:
    get:
      summary: Liveness probe
      operationId: getRootHealthz
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: string
                example: ok
  /readyz:
    get:
      summary: Readiness probe
      description: |
        Not ready when the database is unhealthy, or when PS_REQUIRE_RULEPACK_AT_STARTUP is
        set and no rulepack was loaded at startup.
      operationId: getRootReadyz
      responses:
        '200':
          description: Ready
          content:
            text/plain:
              schema:
                type: string
                example: ready
        '503':
          description: Not ready
          content:
            text/plain:
              schema:
                type: string
                example: not ready
  /metrics:
    get:
      summary: Prometheus metrics (when metrics are enabled)
      operationId: getMetrics
      responses:
        '200':
          description: Prometheus text exposition format
          content:
            text/plain:
              schema:
                type: string
  /check:
    post:
      summary: Decision endpoint at the server root (Envoy ext_authz target)
      description: |
        Same decision contract as /v1/check, scanned against the rulepack loaded from
        PS_ENFORCER_RULEPACK. Any sub-path (/check/{path}) is accepted so Envoy can forward
        the original request path.
      operationId: postRootCheck
      requestBody:
        required: false
        content:
          text/plain:
            schema:
              type: string
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Decision'
        '403':
          description: Quarantine or deny
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Decision'
  /v1/healthz:
    get:
      summary: Liveness probe
      operationId: getHealthz
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: string
                example: ok
  /v1/readyz:
    get:
      summary: Readiness probe
      operationId: getReadyz
      responses:
        '200':
          description: Ready
          content:
            text/plain:
              schema:
                type: string
                example: ready
        '503':
          description: Not ready
          content:
            text/plain:
              schema:
                type: string
                example: 'not ready: rulepack not loaded'
  /v1/version:
    get:
      summary: Version information
      operationId: getVersion
      responses:
        '200':
          description: Version info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
  /v1/check:
    post:
      summary: Evaluate a small payload against rules and return a decision
      description: |
        Returns allow/quarantine/deny with reason and violation count. Intended for small
        bodies (default cap 1MB; configurable via PS_ENFORCER_MAX_BODY_BYTES). Responses carry
        x-ps-decision, x-ps-reason and x-ps-request-id headers.
      operationId: postCheck
      security:
        - {}
        - bearerAuth: []
        - xPSToken: []
      requestBody:
        required: false
        content:
          text/plain:
            schema:
              type: string
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Allowed
          headers:
            x-ps-request-id:
              schema:
                type: string
            x-ps-decision:
              schema:
                type: string
                enum: [allow]
            x-ps-reason:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Decision'
        '403':
          description: Quarantine or deny
          headers:
            x-ps-request-id:
              schema:
                type: string
            x-ps-decision:
              schema:
                type: string
                enum: [quarantine, deny]
            x-ps-reason:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Decision'
        '400':
          description: Body too large or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: PS_ENFORCER_AUTH_TOKEN is set and the token is missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/scan:
    post:
      summary: Scan larger payloads; aggregate JSON or NDJSON stream
      description: |
        Accepts text/plain, application/json or application/x-ndjson. By default
        (aggregate=true) it returns a JSON report of decisions. With application/x-ndjson
        input and aggregate=false the response is an NDJSON stream of decision events.
      operationId: postScan
      security:
        - {}
        - bearerAuth: []
        - xPSToken: []
      parameters:
        - in: query
          name: aggregate
          schema:
            type: boolean
            default: true
          description: Return aggregate JSON when true; NDJSON stream when false
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
          application/json:
            schema:
              type: object
              additionalProperties: true
          application/x-ndjson:
            schema:
              type: string
              description: NDJSON input stream
      responses:
        '200':
          description: Scan report (aggregate) or NDJSON stream
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanReport'
            application/x-ndjson:
              schema:
                type: string
                description: NDJSON stream of decision events
        '401':
          description: PS_ENFORCER_AUTH_TOKEN is set and the token is missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/scan/async:
    post:
      summary: Start an async scan job
      description: |
        Queues the request body for scanning and returns a job id; poll /v1/jobs/{jobID}
        for the result. Also served at the legacy alias /v1/scan:async.
      operationId: postScanAsync
      parameters:
        - in: query
          name: format
          schema:
            type: string
            default: json
          description: Output format recorded with the job
        - in: query
          name: fail_on
          schema:
            type: string
          description: Severity threshold recorded with the job
        - in: query
          name: input_name
          schema:
            type: string
            default: http-request
          description: Input name recorded with the job
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id:
                    type: string
                  status:
                    type: string
                    enum: [pending]
        '400':
          description: Body could not be read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Job submission failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/jobs:
    get:
      summary: List async jobs
      operationId: listJobs
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, running, completed, cancelled, failed]
      responses:
        '200':
          description: Jobs list
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs:
                    type: array
                    items:
                      $ref: '#/components/schemas/Job'
  /v1/jobs/{jobID}:
    parameters:
      - in: path
        name: jobID
        required: true
        schema:
          type: string
    get:
      summary: Get job status
      operationId: getJob
      responses:
        '200':
          description: Job status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Cancel a job
      operationId: deleteJob
      responses:
        '204':
          description: Cancelled
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/rulepacks:
    get:
      summary: List uploaded rulepacks
      description: Returns null when no rulepack has been uploaded.
      operationId: listRulepacks
      responses:
        '200':
          description: Rulepack list
          content:
            application/json:
              schema:
                type: array
                nullable: true
                items:
                  $ref: '#/components/schemas/RulepackMeta'
    post:
      summary: Upload a rulepack (admin)
      operationId: uploadRulepack
      security:
        - bearerAuth: []
        - xPSAdminToken: []
      parameters:
        - in: query
          name: activate
          schema:
            type: boolean
            default: false
          description: Activate the uploaded rulepack
        - in: header
          name: Idempotency-Key
          schema:
            type: string
          description: Repeating a key returns the first response with 200 and X-Idempotency-Cache HIT
      requestBody:
        required: true
        content:
          application/x-yaml:
            schema:
              type: string
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required: [file]
      responses:
        '201':
          description: Uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RulepackMeta'
        '200':
          description: Idempotent replay of an earlier upload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RulepackMeta'
        '400':
          description: Invalid rulepack or form
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: A rulepack with this name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/rulepacks/active:
    get:
      summary: Get the active rulepack
      description: Returns an object with empty fields when no rulepack is active.
      operationId: getActiveRulepack
      responses:
        '200':
          description: Active rulepack
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RulepackMeta'
    put:
      summary: Set the active rulepack (admin)
      operationId: setActiveRulepack
      security:
        - bearerAuth: []
        - xPSAdminToken: []
      parameters:
        - in: header
          name: If-Match
          required: true
          schema:
            type: string
          description: ETag of the currently active version (for example "3"), or * to skip the check
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
              required: [id]
      responses:
        '200':
          description: Active rulepack
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RulepackMeta'
        '400':
          description: Missing or invalid id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '412':
          description: If-Match does not match the active version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '428':
          description: If-Match header missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/rulepacks/validate:
    post:
      summary: Validate a rulepack (admin)
      operationId: validateRulepack
      security:
        - bearerAuth: []
        - xPSAdminToken: []
      requestBody:
        required: true
        content:
          application/x-yaml:
            schema:
              type: string
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                  warnings:
                    type: array
                    nullable: true
                    items:
                      type: string
                  errors:
                    type: array
                    nullable: true
                    items:
                      type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/rulepacks/reload:
    post:
      summary: Reload a rulepack from the configured path (admin)
      operationId: reloadRulepack
      security:
        - bearerAuth: []
        - xPSAdminToken: []
      parameters:
        - in: query
          name: path
          schema:
            type: string
          description: Optional path override to load the rulepack from
      responses:
        '200':
          description: Active rulepack
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RulepackMeta'
        '400':
          description: No path configured, unreadable file or invalid rulepack
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: A rulepack with this name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/rulepacks/{id}:
    delete:
      summary: Delete an uploaded rulepack (admin)
      operationId: deleteRulepack
      security:
        - bearerAuth: []
        - xPSAdminToken: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted
        '400':
          description: Invalid id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Rulepack not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/config:
    get:
      summary: Get the runtime configuration
      operationId: getConfig
      responses:
        '200':
          description: Runtime configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeConfig'
    put:
      summary: Update the runtime configuration (admin)
      operationId: putConfig
      security:
        - bearerAuth: []
        - xPSAdminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeConfig'
      responses:
        '200':
          description: Updated configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeConfig'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/config/reset:
    post:
      summary: Reset the runtime configuration to defaults (admin)
      operationId: resetConfig
      security:
        - bearerAuth: []
        - xPSAdminToken: []
      responses:
        '200':
          description: Reset configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeConfig'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/events:
    get:
      summary: Server-Sent Events for decisions and system events (admin)
      operationId: getEvents
      security:
        - bearerAuth: []
        - xPSAdminToken: []
      parameters:
        - in: query
          name: types
          schema:
            type: string
          description: Comma-separated event types (for example decision,quarantine,deny)
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/decisions:
    get:
      summary: Recent enforcement decisions, newest first (admin)
      description: >-
        Served from a bounded in-memory log (PS_DECISION_LOG_SIZE records,
        default 500). Both /check and /v1/check record here. Prompt content is
        never stored. Results are paged with a cursor: pass the previous
        response's next as before to get the next older page; next is null on
        the last page. Each decision's seq never changes, so decisions recorded
        while paging do not shift later pages; decisions evicted from the log
        are no longer returned.
      operationId: listDecisions
      security:
        - bearerAuth: []
        - xPSAdminToken: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: decision
          in: query
          schema:
            type: string
            enum: [allow, quarantine, deny]
        - name: before
          in: query
          description: >-
            Cursor: return only decisions with seq below this value. Use the
            next value from the previous page. Must be a positive integer.
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Decisions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [decisions, next]
                    properties:
                      decisions:
                        type: array
                        items:
                          $ref: '#/components/schemas/DecisionRecord'
                      next:
                        type: integer
                        format: int64
                        nullable: true
                        description: before value for the next older page, or null on the last page
                  meta:
                    type: object
                    additionalProperties: true
        '400':
          $ref: '#/components/responses/AdminError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/decisions/stats:
    get:
      summary: Decision counts, block rate and latency percentiles (admin)
      operationId: getDecisionStats
      security:
        - bearerAuth: []
        - xPSAdminToken: []
      responses:
        '200':
          description: Decision statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/DecisionStats'
                  meta:
                    type: object
                    additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/decisions/{requestID}:
    get:
      summary: One retained decision by request id (admin)
      operationId: getDecision
      security:
        - bearerAuth: []
        - xPSAdminToken: []
      parameters:
        - name: requestID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Decision
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/DecisionRecord'
                  meta:
                    type: object
                    additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/AdminError'
  /v1/rules:
    get:
      summary: Active RulePacks enforced by /check (admin)
      description: Rule metadata and keyword/pattern counts; match terms are not returned.
      operationId: getActiveRules
      security:
        - bearerAuth: []
        - xPSAdminToken: []
      responses:
        '200':
          description: Active rules
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/RulesSnapshot'
                  meta:
                    type: object
                    additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/rules/reload:
    post:
      summary: Reload PS_ENFORCER_RULEPACK from disk (admin)
      description: On failure the previous rules stay active. Emits a rules_reloaded event.
      operationId: reloadActiveRules
      security:
        - bearerAuth: []
        - xPSAdminToken: []
      responses:
        '200':
          description: Rules after reload
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/RulesSnapshot'
                  meta:
                    type: object
                    additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/AdminError'
        '422':
          $ref: '#/components/responses/AdminError'
  /v1/stats:
    get:
      summary: Summary statistics (admin)
      operationId: getStats
      security:
        - bearerAuth: []
        - xPSAdminToken: []
      responses:
        '200':
          description: Stats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stats'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/usage:
    get:
      summary: Usage over the last hour (admin)
      operationId: getUsage
      security:
        - bearerAuth: []
        - xPSAdminToken: []
      responses:
        '200':
          description: Usage summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usage'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/admin/drain:
    post:
      summary: Begin graceful drain (admin)
      operationId: postAdminDrain
      security:
        - bearerAuth: []
        - xPSAdminToken: []
      responses:
        '202':
          description: Drain initiated
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/admin/shutdown:
    post:
      summary: Graceful shutdown (admin)
      operationId: postAdminShutdown
      security:
        - bearerAuth: []
        - xPSAdminToken: []
      parameters:
        - in: query
          name: delay
          schema:
            type: integer
            format: int32
          description: Optional delay in seconds before shutdown
      responses:
        '202':
          description: Shutdown initiated
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/admin/tenants:
    post:
      summary: Create a tenant (admin)
      operationId: createTenant
      security:
        - bearerAuth: []
        - xPSAdminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        '201':
          description: Tenant created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantEnvelope'
        '400':
          $ref: '#/components/responses/AdminError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/AdminError'
        '501':
          $ref: '#/components/responses/NotConfigured'
    get:
      summary: List tenants (admin)
      operationId: listTenants
      security:
        - bearerAuth: []
        - xPSAdminToken: []
      responses:
        '200':
          description: Up to 100 tenants
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '501':
          $ref: '#/components/responses/NotConfigured'
  /v1/admin/tenants/{id}:
    parameters:
      - $ref: '#/components/parameters/TenantID'
    get:
      summary: Get a tenant (admin)
      operationId: getTenant
      security:
        - bearerAuth: []
        - xPSAdminToken: []
      responses:
        '200':
          description: Tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantEnvelope'
        '400':
          $ref: '#/components/responses/AdminError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/AdminError'
        '501':
          $ref: '#/components/responses/NotConfigured'
    put:
      summary: Rename a tenant (admin)
      operationId: updateTenant
      security:
        - bearerAuth: []
        - xPSAdminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        '200':
          description: Tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantEnvelope'
        '400':
          $ref: '#/components/responses/AdminError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/AdminError'
        '409':
          $ref: '#/components/responses/AdminError'
        '501':
          $ref: '#/components/responses/NotConfigured'
    delete:
      summary: Delete a tenant (admin)
      operationId: deleteTenant
      security:
        - bearerAuth: []
        - xPSAdminToken: []
      responses:
        '204':
          description: Deleted
        '400':
          $ref: '#/components/responses/AdminError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/AdminError'
        '501':
          $ref: '#/components/responses/NotConfigured'
  /v1/admin/tenants/{id}/assignments:
    parameters:
      - $ref: '#/components/parameters/TenantID'
    post:
      summary: Assign a rulepack to a tenant (admin)
      operationId: createAssignment
      security:
        - bearerAuth: []
        - xPSAdminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rulepack_id, target_scope]
              properties:
                rulepack_id:
                  type: string
                  format: uuid
                target_scope:
                  type: string
                  example: /v1/openai/*
                priority:
                  type: integer
      responses:
        '201':
          description: Assignment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEnvelope'
        '400':
          $ref: '#/components/responses/AdminError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/AdminError'
        '501':
          $ref: '#/components/responses/NotConfigured'
    get:
      summary: List a tenant's assignments (admin)
      operationId: listAssignments
      security:
        - bearerAuth: []
        - xPSAdminToken: []
      parameters:
        - in: query
          name: scope
          schema:
            type: string
          description: Only return assignments for this target scope
      responses:
        '200':
          description: Assignments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEnvelope'
        '400':
          $ref: '#/components/responses/AdminError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '501':
          $ref: '#/components/responses/NotConfigured'
  /v1/admin/assignments/{assignmentId}:
    parameters:
      - in: path
        name: assignmentId
        required: true
        schema:
          type: string
          format: uuid
    put:
      summary: Change an assignment's priority (admin)
      operationId: updateAssignment
      security:
        - bearerAuth: []
        - xPSAdminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [priority]
              properties:
                priority:
                  type: integer
      responses:
        '200':
          description: Assignment updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEnvelope'
        '400':
          $ref: '#/components/responses/AdminError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/AdminError'
        '501':
          $ref: '#/components/responses/NotConfigured'
    delete:
      summary: Delete an assignment (admin)
      operationId: deleteAssignment
      security:
        - bearerAuth: []
        - xPSAdminToken: []
      responses:
        '204':
          description: Deleted
        '400':
          $ref: '#/components/responses/AdminError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/AdminError'
        '501':
          $ref: '#/components/responses/NotConfigured'
  /v1/admin/audits:
    get:
      summary: List audit events for a tenant (admin)
      operationId: listAuditEvents
      security:
        - bearerAuth: []
        - xPSAdminToken: []
      parameters:
        - $ref: '#/components/parameters/AuditTenant'
        - $ref: '#/components/parameters/AuditLimit'
      responses:
        '200':
          description: Audit events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEnvelope'
        '400':
          $ref: '#/components/responses/AdminError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '501':
          $ref: '#/components/responses/NotConfigured'
  /v1/admin/audits/search:
    post:
      summary: Search audit events (admin)
      operationId: searchAuditEvents
      security:
        - bearerAuth: []
        - xPSAdminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditSearchRequest'
      responses:
        '200':
          description: Matching audit events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEnvelope'
        '400':
          $ref: '#/components/responses/AdminError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '501':
          $ref: '#/components/responses/NotConfigured'
  /v1/admin/audits/export:
    get:
      summary: Export audit events as JSON or CSV (admin)
      operationId: exportAuditEvents
      security:
        - bearerAuth: []
        - xPSAdminToken: []
      parameters:
        - in: query
          name: format
          schema:
            type: string
            enum: [json, csv]
            default: json
        - $ref: '#/components/parameters/AuditTenant'
        - $ref: '#/components/parameters/AuditLimit'
      responses:
        '200':
          description: Export file; X-PS-Export-Count gives the number of events
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
            text/csv:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/AdminError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '501':
          $ref: '#/components/responses/NotConfigured'
  /v1/admin/audits/object/{type}/{objectId}:
    get:
      summary: Audit events for one object (admin)
      operationId: getAuditEventsByObject
      security:
        - bearerAuth: []
        - xPSAdminToken: []
      parameters:
        - in: path
          name: type
          required: true
          schema:
            type: string
            example: tenant
        - in: path
          name: objectId
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/AuditLimit'
      responses:
        '200':
          description: Audit events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEnvelope'
        '400':
          $ref: '#/components/responses/AdminError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '501':
          $ref: '#/components/responses/NotConfigured'
  /v1/admin/system/features:
    get:
      summary: Enabled feature flags (admin)
      operationId: getSystemFeatures
      security:
        - bearerAuth: []
        - xPSAdminToken: []
      responses:
        '200':
          description: Feature flags
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/admin/system/stats:
    get:
      summary: System stats (admin)
      operationId: getSystemStats
      security:
        - bearerAuth: []
        - xPSAdminToken: []
      responses:
        '200':
          description: Stats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/admin/system/info:
    get:
      summary: Build and runtime info (admin)
      operationId: getSystemInfo
      security:
        - bearerAuth: []
        - xPSAdminToken: []
      responses:
        '200':
          description: System info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/admin/system/drain:
    post:
      summary: Begin graceful drain, JSON response (admin)
      operationId: postSystemDrain
      security:
        - bearerAuth: []
        - xPSAdminToken: []
      responses:
        '202':
          description: Drain initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/admin/system/shutdown:
    post:
      summary: Graceful shutdown, JSON response (admin)
      operationId: postSystemShutdown
      security:
        - bearerAuth: []
        - xPSAdminToken: []
      parameters:
        - in: query
          name: delay
          schema:
            type: integer
            format: int32
          description: Optional delay in seconds before shutdown
      responses:
        '202':
          description: Shutdown initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  parameters:
    TenantID:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
    AuditTenant:
      in: query
      name: tenant
      schema:
        type: string
        format: uuid
      description: Tenant to read; with no tenant the result is empty
    AuditLimit:
      in: query
      name: limit
      schema:
        type: integer
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    xPSToken:
      type: apiKey
      in: header
      name: X-PS-Token
    xPSAdminToken:
      type: apiKey
      in: header
      name: X-PS-Admin-Token
  responses:
    AdminError:
      description: Request rejected
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotConfigured:
      description: The backing repository is not configured (NOT_IMPLEMENTED)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Admin token missing or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    AdminEnvelope:
      type: object
      description: Tenant, assignment, audit and system admin routes wrap their payload in data.
      properties:
        data:
          type: object
          additionalProperties: true
        meta:
          type: object
          additionalProperties: true
    TenantEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Tenant'
        meta:
          type: object
          additionalProperties: true
    Tenant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AuditSearchRequest:
      type: object
      properties:
        tenant_id:
          type: string
          format: uuid
        actor_id:
          type: string
          format: uuid
        actor_email:
          type: string
        actions:
          type: array
          items:
            type: string
        object_types:
          type: array
          items:
            type: string
        object_id:
          type: string
          format: uuid
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        limit:
          type: integer
        offset:
          type: integer
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: UNAUTHORIZED
            message:
              type: string
            details:
              type: object
              additionalProperties: true
        meta:
          type: object
          additionalProperties: true
    Decision:
      type: object
      properties:
        decision:
          type: string
          enum: [allow, quarantine, deny]
        reason:
          type: string
          description: Matching rule id, or no_signals
        violations:
          type: integer
          format: int32
        request_id:
          type: string
    Version:
      type: object
      properties:
        version:
          type: string
        commit:
          type: string
        build_date:
          type: string
    RulepackMeta:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        version:
          type: string
        source:
          type: string
        active:
          type: boolean
    Job:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          example: scan
        status:
          type: string
          enum: [pending, running, completed, cancelled, failed]
        input:
          type: string
          format: byte
        result:
          type: object
          additionalProperties: true
        error:
          type: string
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        progress:
          type: integer
        metadata:
          type: object
          additionalProperties: true
    RuntimeConfig:
      type: object
      properties:
        enforcement_mode:
          type: string
          enum: [observe, redact, quarantine, enforce]
        fail_on:
          type: string
          enum: [INFO, WARNING, HIGH, ERROR, CRITICAL]
        redaction_enabled:
          type: boolean
        max_stream_bytes:
          type: integer
          format: int64
        stream_window:
          type: integer
        stream_overlap:
          type: integer
        rps:
          type: number
          format: float
        rps_burst:
          type: integer
        inflight_limit_bytes:
          type: integer
          format: int64
        inflight_backoff_ms:
          type: integer
        per_rule_timeout_ms:
          type: integer
        request_timeout_ms:
          type: integer
        response_timeout_ms:
          type: integer
    ScanReport:
      type: object
      properties:
        decisions:
          type: array
          items:
            $ref: '#/components/schemas/Decision'
        summary:
          type: object
          properties:
            total:
              type: integer
            violations:
              type: integer
    DecisionRecord:
      type: object
      properties:
        seq:
          type: integer
          format: int64
          description: Position in the decision log, increasing by one per decision; the paging cursor
        request_id:
          type: string
        time:
          type: string
          format: date-time
        path:
          type: string
        decision:
          type: string
          enum: [allow, quarantine, deny]
        reason:
          type: string
        status:
          type: integer
        latency_ms:
          type: number
        bytes_in:
          type: integer
        violations:
          type: integer
        matches:
          type: array
          items:
            type: object
            properties:
              rule_id:
                type: string
              severity:
                type: string
              category:
                type: string
              action:
                type: string
              message:
                type: string
    DecisionStats:
      type: object
      properties:
        total:
          type: integer
        by_decision:
          type: object
          additionalProperties:
            type: integer
        block_rate:
          type: number
          description: (deny + quarantine) / total
        latency_p50_ms:
          type: number
        latency_p95_ms:
          type: number
        last_minute:
          type: integer
        retained:
          type: integer
        capacity:
          type: integer
        since:
          type: string
          format: date-time
    RulesSnapshot:
      type: object
      properties:
        source:
          type: string
        loaded_at:
          type: string
          format: date-time
        generation:
          type: integer
        rule_count:
          type: integer
        packs:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              version:
                type: string
              description:
                type: string
              rules:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    name:
                      type: string
                    level:
                      type: integer
                    severity:
                      type: string
                    category:
                      type: string
                    action:
                      type: string
                    enabled:
                      type: boolean
                    keywords:
                      type: integer
                    patterns:
                      type: integer
    Stats:
      type: object
      properties:
        decisions_total:
          type: object
          additionalProperties:
            type: integer
        p95_latency_ms:
          type: number
          format: float
    Usage:
      type: object
      properties:
        window_start:
          type: string
          format: date-time
        window_end:
          type: string
          format: date-time
        counts:
          type: integer
        bytes:
          type: integer
