openapi: 3.0.3
info:
  title: PromptShield Gateway HTTP API
  version: 0.2.0
  description: |
    HTTP surface of the PromptShield enforcer (ps-enforcer, default :9090) for health,
    decisions, configuration, rulepack lifecycle, async jobs and observability. Versioned
    endpoints are under /v1. The server root also serves /healthz, /readyz, /metrics
    (when metrics are enabled) and POST /check, plus /check/* for Envoy ext_authz
    path_prefix forwarding.

    Decision endpoints (/v1/check, /v1/scan) require a token only when
    PS_ENFORCER_AUTH_TOKEN is set. Admin endpoints require PS_ENFORCER_ADMIN_TOKEN, sent
    as a bearer token or X-PS-Admin-Token; with no admin token configured they answer 401
    unless insecure admin access is enabled.

    Not covered here: the /v1/debug/* endpoints and the tenant, assignment, audit and
    system admin routes.
servers:
  - url: http://localhost:9090
    description: Local development
paths:
  /healthz:
    get:
      summary: Liveness probe
      operationId: getRootHealthz
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: string
                example: ok
  /readyz:
    get:
      summary: Readiness probe
      description: |
        Not ready when the database is unhealthy, or when PS_REQUIRE_RULEPACK_AT_STARTUP is
        set and no rulepack was loaded at startup.
      operationId: getRootReadyz
      responses:
        '200':
          description: Ready
          content:
            text/plain:
              schema:
                type: string
                example: ready
        '503':
          description: Not ready
          content:
            text/plain:
              schema:
                type: string
                example: not ready
  /metrics:
    get:
      summary: Prometheus metrics (when metrics are enabled)
      operationId: getMetrics
      responses:
        '200':
          description: Prometheus text exposition format
          content:
            text/plain:
              schema:
                type: string
  /check:
    post:
      summary: Decision endpoint at the server root (Envoy ext_authz target)
      description: |
        Same decision contract as /v1/check, scanned against the rulepack loaded from
        PS_ENFORCER_RULEPACK. Any sub-path (/check/{path}) is accepted so Envoy can forward
        the original request path.
      operationId: postRootCheck
      requestBody:
        required: false
        content:
          text/plain:
            schema:
              type: string
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Decision'
        '403':
          description: Quarantine or deny
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Decision'
  /v1/healthz:
    get:
      summary: Liveness probe
      operationId: getHealthz
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: string
                example: ok
  /v1/readyz:
    get:
      summary: Readiness probe
      operationId: getReadyz
      responses:
        '200':
          description: Ready
          content:
            text/plain:
              schema:
                type: string
                example: ready
        '503':
          description: Not ready
          content:
            text/plain:
              schema:
                type: string
                example: 'not ready: rulepack not loaded'
  /v1/version:
    get:
      summary: Version information
      operationId: getVersion
      responses:
        '200':
          description: Version info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
  /v1/check:
    post:
      summary: Evaluate a small payload against rules and return a decision
      description: |
        Returns allow/quarantine/deny with reason and violation count. Intended for small
        bodies (default cap 1MB; configurable via PS_ENFORCER_MAX_BODY_BYTES). Responses carry
        x-ps-decision, x-ps-reason and x-ps-request-id headers.
      operationId: postCheck
      security:
        - {}
        - bearerAuth: []
        - xPSToken: []
      requestBody:
        required: false
        content:
          text/plain:
            schema:
              type: string
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Allowed
          headers:
            x-ps-request-id:
              schema:
                type: string
            x-ps-decision:
              schema:
                type: string
                enum: [allow]
            x-ps-reason:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Decision'
        '403':
          description: Quarantine or deny
          headers:
            x-ps-request-id:
              schema:
                type: string
            x-ps-decision:
              schema:
                type: string
                enum: [quarantine, deny]
            x-ps-reason:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Decision'
        '400':
          description: Body too large or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: PS_ENFORCER_AUTH_TOKEN is set and the token is missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/scan:
    post:
      summary: Scan larger payloads; aggregate JSON or NDJSON stream
      description: |
        Accepts text/plain, application/json or application/x-ndjson. By default
        (aggregate=true) it returns a JSON report of decisions. With application/x-ndjson
        input and aggregate=false the response is an NDJSON stream of decision events.
      operationId: postScan
      security:
        - {}
        - bearerAuth: []
        - xPSToken: []
      parameters:
        - in: query
          name: aggregate
          schema:
            type: boolean
            default: true
          description: Return aggregate JSON when true; NDJSON stream when false
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
          application/json:
            schema:
              type: object
              additionalProperties: true
          application/x-ndjson:
            schema:
              type: string
              description: NDJSON input stream
      responses:
        '200':
          description: Scan report (aggregate) or NDJSON stream
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanReport'
            application/x-ndjson:
              schema:
                type: string
                description: NDJSON stream of decision events
        '401':
          description: PS_ENFORCER_AUTH_TOKEN is set and the token is missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/scan/async:
    post:
      summary: Start an async scan job
      description: |
        Queues the request body for scanning and returns a job id; poll /v1/jobs/{jobID}
        for the result. Also served at the legacy alias /v1/scan:async.
      operationId: postScanAsync
      parameters:
        - in: query
          name: format
          schema:
            type: string
            default: json
          description: Output format recorded with the job
        - in: query
          name: fail_on
          schema:
            type: string
          description: Severity threshold recorded with the job
        - in: query
          name: input_name
          schema:
            type: string
            default: http-request
          description: Input name recorded with the job
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id:
                    type: string
                  status:
                    type: string
                    enum: [pending]
        '400':
          description: Body could not be read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Job submission failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/jobs:
    get:
      summary: List async jobs
      operationId: listJobs
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, running, completed, cancelled, failed]
      responses:
        '200':
          description: Jobs list
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs:
                    type: array
                    items:
                      $ref: '#/components/schemas/Job'
  /v1/jobs/{jobID}:
    parameters:
      - in: path
        name: jobID
        required: true
        schema:
          type: string
    get:
      summary: Get job status
      operationId: getJob
      responses:
        '200':
          description: Job status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Cancel a job
      operationId: deleteJob
      responses:
        '204':
          description: Cancelled
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/rulepacks:
    get:
      summary: List uploaded rulepacks
      description: Returns null when no rulepack has been uploaded.
      operationId: listRulepacks
      responses:
        '200':
          description: Rulepack list
          content:
            application/json:
              schema:
                type: array
                nullable: true
                items:
                  $ref: '#/components/schemas/RulepackMeta'
    post:
      summary: Upload a rulepack (admin)
      operationId: uploadRulepack
      security:
        - bearerAuth: []
        - xPSAdminToken: []
      parameters:
        - in: query
          name: activate
          schema:
            type: boolean
            default: false
          description: Activate the uploaded rulepack
        - in: header
          name: Idempotency-Key
          schema:
            type: string
          description: Repeating a key returns the first response with 200 and X-Idempotency-Cache HIT
      requestBody:
        required: true
        content:
          application/x-yaml:
            schema:
              type: string
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required: [file]
      responses:
        '201':
          description: Uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RulepackMeta'
        '200':
          description: Idempotent replay of an earlier upload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RulepackMeta'
        '400':
          description: Invalid rulepack or form
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: A rulepack with this name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/rulepacks/active:
    get:
      summary: Get the active rulepack
      description: Returns an object with empty fields when no rulepack is active.
      operationId: getActiveRulepack
      responses:
        '200':
          description: Active rulepack
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RulepackMeta'
    put:
      summary: Set the active rulepack (admin)
      operationId: setActiveRulepack
      security:
        - bearerAuth: []
        - xPSAdminToken: []
      parameters:
        - in: header
          name: If-Match
          required: true
          schema:
            type: string
          description: ETag of the currently active version (for example "3"), or * to skip the check
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
              required: [id]
      responses:
        '200':
          description: Active rulepack
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RulepackMeta'
        '400':
          description: Missing or invalid id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '412':
          description: If-Match does not match the active version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '428':
          description: If-Match header missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/rulepacks/validate:
    post:
      summary: Validate a rulepack (admin)
      operationId: validateRulepack
      security:
        - bearerAuth: []
        - xPSAdminToken: []
      requestBody:
        required: true
        content:
          application/x-yaml:
            schema:
              type: string
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                  warnings:
                    type: array
                    nullable: true
                    items:
                      type: string
                  errors:
                    type: array
                    nullable: true
                    items:
                      type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/rulepacks/reload:
    post:
      summary: Reload a rulepack from the configured path (admin)
      operationId: reloadRulepack
      security:
        - bearerAuth: []
        - xPSAdminToken: []
      parameters:
        - in: query
          name: path
          schema:
            type: string
          description: Optional path override to load the rulepack from
      responses:
        '200':
          description: Active rulepack
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RulepackMeta'
        '400':
          description: No path configured, unreadable file or invalid rulepack
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: A rulepack with this name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/rulepacks/{id}:
    delete:
      summary: Delete an uploaded rulepack (admin)
      operationId: deleteRulepack
      security:
        - bearerAuth: []
        - xPSAdminToken: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted
        '400':
          description: Invalid id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Rulepack not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/config:
    get:
      summary: Get the runtime configuration
      operationId: getConfig
      responses:
        '200':
          description: Runtime configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeConfig'
    put:
      summary: Update the runtime configuration (admin)
      operationId: putConfig
      security:
        - bearerAuth: []
        - xPSAdminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeConfig'
      responses:
        '200':
          description: Updated configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeConfig'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/config/reset:
    post:
      summary: Reset the runtime configuration to defaults (admin)
      operationId: resetConfig
      security:
        - bearerAuth: []
        - xPSAdminToken: []
      responses:
        '200':
          description: Reset configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeConfig'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/events:
    get:
      summary: Server-Sent Events for decisions and system events (admin)
      operationId: getEvents
      security:
        - bearerAuth: []
        - xPSAdminToken: []
      parameters:
        - in: query
          name: types
          schema:
            type: string
          description: Comma-separated event types (for example decision,quarantine,deny)
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/stats:
    get:
      summary: Summary statistics (admin)
      operationId: getStats
      security:
        - bearerAuth: []
        - xPSAdminToken: []
      responses:
        '200':
          description: Stats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stats'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/usage:
    get:
      summary: Usage over the last hour (admin)
      operationId: getUsage
      security:
        - bearerAuth: []
        - xPSAdminToken: []
      responses:
        '200':
          description: Usage summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usage'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/admin/drain:
    post:
      summary: Begin graceful drain (admin)
      operationId: postAdminDrain
      security:
        - bearerAuth: []
        - xPSAdminToken: []
      responses:
        '202':
          description: Drain initiated
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/admin/shutdown:
    post:
      summary: Graceful shutdown (admin)
      operationId: postAdminShutdown
      security:
        - bearerAuth: []
        - xPSAdminToken: []
      parameters:
        - in: query
          name: delay
          schema:
            type: integer
            format: int32
          description: Optional delay in seconds before shutdown
      responses:
        '202':
          description: Shutdown initiated
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    xPSToken:
      type: apiKey
      in: header
      name: X-PS-Token
    xPSAdminToken:
      type: apiKey
      in: header
      name: X-PS-Admin-Token
  responses:
    Unauthorized:
      description: Admin token missing or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: UNAUTHORIZED
            message:
              type: string
            details:
              type: object
              additionalProperties: true
        meta:
          type: object
          additionalProperties: true
    Decision:
      type: object
      properties:
        decision:
          type: string
          enum: [allow, quarantine, deny]
        reason:
          type: string
          description: Matching rule id, or no_signals
        violations:
          type: integer
          format: int32
        request_id:
          type: string
    Version:
      type: object
      properties:
        version:
          type: string
        commit:
          type: string
        build_date:
          type: string
    RulepackMeta:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        version:
          type: string
        source:
          type: string
        active:
          type: boolean
    Job:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          example: scan
        status:
          type: string
          enum: [pending, running, completed, cancelled, failed]
        input:
          type: string
          format: byte
        result:
          type: object
          additionalProperties: true
        error:
          type: string
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        progress:
          type: integer
        metadata:
          type: object
          additionalProperties: true
    RuntimeConfig:
      type: object
      properties:
        enforcement_mode:
          type: string
          enum: [observe, redact, quarantine, enforce]
        fail_on:
          type: string
          enum: [INFO, WARNING, HIGH, ERROR, CRITICAL]
        redaction_enabled:
          type: boolean
        max_stream_bytes:
          type: integer
          format: int64
        stream_window:
          type: integer
        stream_overlap:
          type: integer
        rps:
          type: number
          format: float
        rps_burst:
          type: integer
        inflight_limit_bytes:
          type: integer
          format: int64
        inflight_backoff_ms:
          type: integer
        per_rule_timeout_ms:
          type: integer
        request_timeout_ms:
          type: integer
        response_timeout_ms:
          type: integer
    ScanReport:
      type: object
      properties:
        decisions:
          type: array
          items:
            $ref: '#/components/schemas/Decision'
        summary:
          type: object
          properties:
            total:
              type: integer
            violations:
              type: integer
    Stats:
      type: object
      properties:
        decisions_total:
          type: object
          additionalProperties:
            type: integer
        p95_latency_ms:
          type: number
          format: float
    Usage:
      type: object
      properties:
        window_start:
          type: string
          format: date-time
        window_end:
          type: string
          format: date-time
        counts:
          type: integer
        bytes:
          type: integer
