apiVersion: promptshield.io/v1
kind: RulePack
metadata:
  name: test-moderation
  version: 1.0.0
  description: Simple test for omni-moderation

rules:
  # Level 1: Basic keyword detection
  - id: basic-keywords
    name: Basic harmful keywords
    level: 1
    severity: MEDIUM
    keywords:
      - "harassment"
      - "threatening"
      - "harmful"
    response:
      action: warn
      message: "Potentially harmful keywords detected"

  # Level 3: Semantic analysis (DeBERTa risk-based)
  - id: universal-moderation-check
    name: Check all content with DeBERTa risk classifier
    level: 3
    severity: HIGH
    semantic:
      confidence_threshold: 0.7  # Higher threshold to reduce false positives
      fallback_on_error: true
    fallback:
      patterns:
        - regex: '(?i)(harassment|hate|threat|harmful)'
    response:
      action: enforce
      message: "Content flagged by risk classifier"

performance:
  per_rule_timeout: 10s
  total_timeout: 15s
  
composition:
  strategy: all_matches