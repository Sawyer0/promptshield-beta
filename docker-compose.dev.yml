version: '3.8'

services:
  # Local Postgres for dev only
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_PASSWORD: example
      POSTGRES_USER: promptshield
      POSTGRES_DB: promptshield
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      - promptshield-net

  promptshield:
    environment:
      PS_PG_DSN: postgres://promptshield:example@postgres:5432/promptshield?sslmode=disable
      PS_DEV_BYPASS_AUTH: "true"
      PS_DISABLE_METRICS: ""
      PS_SEMANTIC_ENABLED: "true"
      PS_DEBERTA_ENDPOINT: "http://deberta-offline:8089/infer"
      PS_DEBERTA_TOKENIZER_JSON: "/app/assets/tokenizers/tokenizer.json"
      PS_DEBERTA_LOWERCASE: "true"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - ./assets/tokenizers:/app/assets/tokenizers:ro
    ports:
      - "9090:9090"
      - "9091:9091"
    networks:
      - promptshield-net
    depends_on:
      - deberta-offline

  deberta-offline:
    image: python:3.11-slim
    environment:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      TOKENIZER_DIR: /app/assets/tokenizers
      MODEL_DIR: /models
    volumes:
      - C:\\models\\deberta-onnx:/models:ro
      - ./:/app:ro
    working_dir: /app/tools/deberta-offline
    command: /bin/sh -c "pip install --no-cache-dir fastapi uvicorn onnxruntime transformers numpy && uvicorn app:app --host 0.0.0.0 --port 8089 --workers 2"
    ports:
      - "8089:8089"
    networks:
      - promptshield-net

  frontend-bff:
    environment:
      DATABASE_URL: postgres://promptshield:example@postgres:5432/promptshield?sslmode=disable
      PS_PG_DSN: postgres://promptshield:example@postgres:5432/promptshield?sslmode=disable
      PS_DEV_BYPASS_AUTH: "true"

networks:
  promptshield-net:
    external: false

volumes:
  pg-data:

