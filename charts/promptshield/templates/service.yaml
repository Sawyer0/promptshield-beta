apiVersion: v1
kind: Service
metadata:
  name: {{ include "promptshield.fullname" . }}
  labels:
    {{- include "promptshield.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "promptshield.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
    - name: grpc
      port: {{ .Values.service.grpcPort }}
      targetPort: grpc
