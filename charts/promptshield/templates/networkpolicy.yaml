{{- if eq .Values.egress.policy "deny" }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "promptshield.fullname" . }}-egress
spec:
  podSelector:
    matchLabels:
      {{- include "promptshield.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: {{ .Values.egress.cidrBlock }}
{{- end }}
