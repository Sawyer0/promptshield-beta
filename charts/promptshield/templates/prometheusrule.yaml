{{- if .Values.monitoring.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "promptshield.fullname" . }}-alerts
  labels:
    {{- include "promptshield.labels" . | nindent 4 }}
    {{- with .Values.monitoring.prometheusRule.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: promptshield-slo
      rules:
        - alert: PSLatencyP95High
          expr: histogram_quantile(0.95, sum by (le) (rate(ps_enforcer_request_duration_seconds_bucket[5m]))) > 0.3
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "PromptShield p95 latency > 300ms"
        - alert: PSViolationRateHigh
          expr: sum(rate(ps_enforcer_decisions_total{decision!="allow"}[5m])) > 50
          for: 10m
          labels:
            severity: info
          annotations:
            summary: "High non-allow decision rate"
        - alert: PSAvailabilityDrop
          expr: up{job="{{ include "promptshield.fullname" . }}"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Enforcer HTTP endpoint down"
{{- end }}


