replicaCount: 1

image:
  repository: ghcr.io/promptshield/enforcer
  tag: "0.2.0"
  pullPolicy: IfNotPresent

mode: observe # observe | enforce

rbac:
  create: true
  type: ClusterRole # ClusterRole | Namespaced

serviceAccount:
  create: true
  name: ""

service:
  type: ClusterIP
  port: 9090
  grpcPort: 9091

resources: {}

database:
  useIAM: true
  region: us-east-1
  dbName: promptshield
  iamUser: ps_app
  proxyEndpoint: "" # e.g., my-proxy.proxy-xxxxxxxx.us-east-1.rds.amazonaws.com

nodeSelector: {}

affinity: {}

tolerations: []

egress:
  policy: allow # allow | deny
  cidrBlock: 0.0.0.0/0

monitoring:
  scrapeInterval: 15s
  serviceMonitor:
    enabled: false
    additionalLabels: {}
    relabelings: []
  prometheusRule:
    enabled: false
    additionalLabels: {}