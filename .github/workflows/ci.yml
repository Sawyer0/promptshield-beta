name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Cache Go build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-go-
      - name: Tidy
        run: make tidy
      - name: Fmt
        run: make fmt
      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
      - name: Test
        run: make test
      - name: Govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: '1.25.x'
          go-package: ./...
      - name: Gosec
        uses: securego/gosec@master
        with:
          args: ./...

  go-coverage:
    name: Backend coverage (Go)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test (race + coverage)
        run: |
          go test ./... -race -covermode=atomic -coverprofile=coverage.out

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-go
          path: coverage.out
          if-no-files-found: ignore

      - name: Upload coverage to Codecov (Go)
        uses: codecov/codecov-action@v4
        with:
          files: coverage.out
          flags: backend
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  frontend:
    name: Frontend (Vite + Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/RulepackManager
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/RulepackManager/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Build (Vite)
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ci-placeholder
        run: npm run build

      - name: Test (Vitest) with coverage
        run: npm run test:coverage

      - name: Upload frontend coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: frontend/RulepackManager/coverage
          if-no-files-found: ignore

      - name: Upload coverage to Codecov (Frontend)
        uses: codecov/codecov-action@v4
        with:
          directory: frontend/RulepackManager/coverage
          flags: frontend
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

