name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0
      - name: Test
        run: go test -race ./...

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/dashboard/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build (into the Go embed directory)
        run: npm run build
      - name: Build gateway with the embedded dashboard
        working-directory: .
        run: go build -o bin/ps-gateway-e2e ./gateway
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests against the real gateway
        run: npm run e2e
        env:
          CI: 'true'
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/dashboard/playwright-report
          retention-days: 7

  docker-image:
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILDKIT: '1'
      SMOKE_TOKEN: ci-smoke-token
    steps:
      - uses: actions/checkout@v4
      - name: Build the gateway image (local only, never pushed)
        run: docker build -f Dockerfile.gateway -t ps-gateway:ci .
      - name: Start the container
        run: |
          docker run -d --name ps-gateway -p 127.0.0.1:9090:9090 \
            -e PS_ENFORCER_TLS_MODE=disable -e PS_ENFORCER_GRPC_TLS_MODE=disable \
            -e PS_ENFORCER_ADMIN_TOKEN="$SMOKE_TOKEN" \
            -e PS_ENFORCER_RULEPACK=/rules/prompt-injection.yaml \
            -e PS_ENFORCER_MODE=enforce -e PS_REQUIRE_RULEPACK_AT_STARTUP=true \
            -e PS_TELEMETRY=false \
            -v "$PWD/rules:/rules:ro" ps-gateway:ci
      - name: Smoke-test the dashboard and admin API in the container
        run: scripts/smoke-gateway.sh http://127.0.0.1:9090 "$SMOKE_TOKEN"
      - name: Image health check command works
        run: docker exec ps-gateway wget -qO- http://127.0.0.1:9090/healthz
      - name: Container logs
        if: always()
        run: docker logs ps-gateway 2>&1 | tail -n 100
