name: Security Scans

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

jobs:
  trivy-repo-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy FS scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          format: table
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: '1'


