project_name: promptshield

before:
  hooks:
    - go mod tidy

builds:
  - id: ps-enforcer
    main: ./enforcer
    binary: ps-enforcer
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - id: default
    format: tar.gz
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    files:
      - LICENSE*
      - README.md

checksums:
  name_template: 'checksums.txt'

sboms:
  - artifacts: [binary]

release:
  draft: false
  prerelease: false

brews: []
scoops: []

signs:
  - id: cosign-checksums
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sig"
    args: ["sign-blob", "--yes", "--output-signature", "${signature}", "${artifact}"]


