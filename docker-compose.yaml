version: '3.8'

services:
  promptshield:
    build:
      context: .
      dockerfile: Dockerfile.gateway
      args:
        ENABLE_HYPERSCAN: ${ENABLE_HYPERSCAN:-0}
    env_file:
      - .env.production
    environment:
      PS_PG_DSN: ${PS_PG_DSN}
      PS_TENANT_ID: ${PS_TENANT_ID:-6f4d338d-f0c0-4091-b54e-f71752c8f568}
      # Enforcer configuration
      PS_ENFORCER_ADDR: :9090
      PS_ENFORCER_GRPC_ADDR: :9091
      PS_ENFORCER_MODE: enforce
      PS_ENFORCER_ENFORCEMENT_MODE: ${PS_ENFORCER_ENFORCEMENT_MODE:-enforce}
      PS_ENFORCER_TIMEOUT: ${PS_ENFORCER_TIMEOUT:-300ms}
      PS_ENFORCER_MAX_BODY_BYTES: ${PS_ENFORCER_MAX_BODY_BYTES:-10485760}
      PS_ENFORCER_FAIL_ON: ${PS_ENFORCER_FAIL_ON:-HIGH}
      # Security & Auth
      PS_ENFORCER_ADMIN_TOKEN: ${PS_ADMIN_TOKEN:-ps-admin-token-dev}
      PS_FRONTEND_TOKEN: ${PS_FRONTEND_TOKEN:-ps-admin-token-dev}
      PS_ENFORCER_TLS_MODE: ${PS_ENFORCER_TLS_MODE:-disable}
      PS_ENFORCER_GRPC_TLS_MODE: ${PS_ENFORCER_GRPC_TLS_MODE:-disable}
      # Semantic analysis (DeBERTa only)
      PS_DEBERTA_ENDPOINT: ${PS_DEBERTA_ENDPOINT}
      # Telemetry
      PS_TELEMETRY: ${PS_TELEMETRY:-1}
      PS_TELEMETRY_ENDPOINT: otel-collector:4317
      # License
      PS_DISABLE_LICENSE: "1"
      # BFF JWT validation (public key)
      PS_BFF_JWT_PUBLIC_KEY: ${PS_BFF_JWT_PUBLIC_KEY}
      PS_BFF_JWT_ISSUER: ${PS_BFF_JWT_ISSUER:-promptshield-bff}
      PS_BFF_JWT_AUDIENCE: ${PS_BFF_JWT_AUDIENCE:-promptshield-gateway}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    expose:
      - "9090"
      - "9091"
    networks:
      - promptshield-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


  frontend-bff:
    build:
      context: ./frontend/RulepackManager
      dockerfile: Dockerfile.bff
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY}
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${PS_PG_DSN}
      PS_PG_DSN: ${PS_PG_DSN}
      PS_TENANT_ID: ${PS_TENANT_ID}
      SESSION_STORE: redis
      REDIS_URL: redis://redis:6379
      SESSION_COOKIE_SECURE: "false"
      PGSSLMODE: require
      SESSION_SECRET: ${SESSION_SECRET:-change-me-long-random-string-for-production}
      PS_GATEWAY_URL: http://promptshield:9090
      PS_BFF_JWT_PRIVATE_KEY: ${PS_BFF_JWT_PRIVATE_KEY}
      PS_BFF_JWT_ISSUER: ${PS_BFF_JWT_ISSUER:-promptshield-bff}
      PS_BFF_JWT_AUDIENCE: ${PS_BFF_JWT_AUDIENCE:-promptshield-gateway}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY}
    depends_on:
      promptshield:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      - promptshield-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    expose:
      - "6379"
    restart: unless-stopped
    networks:
      - promptshield-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.95.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deploy/otel/collector.yaml:/etc/otelcol/config.yaml:ro
    environment:
      TEMPO_OTLP_ENDPOINT: ${TEMPO_OTLP_ENDPOINT}
      TEMPO_INSECURE: ${TEMPO_INSECURE:-true}
      TEMPO_CA_FILE: ${TEMPO_CA_FILE}
      JAEGER_ENDPOINT: ${JAEGER_ENDPOINT}
      JAEGER_INSECURE: ${JAEGER_INSECURE:-true}
      JAEGER_CA_FILE: ${JAEGER_CA_FILE}
      LOKI_ENDPOINT: ${LOKI_ENDPOINT}
      LOKI_INSECURE: ${LOKI_INSECURE:-true}
      LOKI_TENANT_ID: ${LOKI_TENANT_ID}
      LOKI_CA_FILE: ${LOKI_CA_FILE}
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    restart: unless-stopped
    networks:
      - promptshield-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  promptshield-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  redis-data:
