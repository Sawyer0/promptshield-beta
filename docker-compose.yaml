version: '3.8'

x-promptshield-common: &promptshield-common
  build:
    context: .
    dockerfile: Dockerfile.gateway
    args:
      ENABLE_HYPERSCAN: ${ENABLE_HYPERSCAN:-0}
  env_file:
    - .env.production
  environment:
    # Database configuration (Supabase Session Pooler)
    PS_PG_DSN: ${PS_PG_DSN}
    PS_TENANT_ID: "6f4d338d-f0c0-4091-b54e-f71752c8f568"
    
    # Enforcer configuration
    PS_ENFORCER_ADDR: :9090
    PS_ENFORCER_GRPC_ADDR: :9091
    PS_ENFORCER_MODE: enforce
    PS_ENFORCER_ENFORCEMENT_MODE: ${PS_ENFORCER_ENFORCEMENT_MODE:-enforce}
    PS_ENFORCER_TIMEOUT: ${PS_ENFORCER_TIMEOUT:-300ms}
    PS_ENFORCER_MAX_BODY_BYTES: ${PS_ENFORCER_MAX_BODY_BYTES:-10485760}
    PS_ENFORCER_FAIL_ON: ${PS_ENFORCER_FAIL_ON:-HIGH}
    
    # Security & Auth
    PS_ENFORCER_ADMIN_TOKEN: ${PS_ADMIN_TOKEN:-ps-admin-token-dev}
    PS_FRONTEND_TOKEN: ${PS_FRONTEND_TOKEN:-ps-admin-token-dev}
    PS_ENFORCER_TLS_MODE: ${PS_ENFORCER_TLS_MODE:-disable}
    PS_ENFORCER_GRPC_TLS_MODE: ${PS_ENFORCER_GRPC_TLS_MODE:-disable}
    
    # Semantic analysis
    PS_SEMANTIC_ENABLED: ${PS_SEMANTIC_ENABLED:-true}
    PS_SEMANTIC_PROVIDER: ${PS_SEMANTIC_PROVIDER:-openai}
    PS_SEMANTIC_TIMEOUT: ${PS_SEMANTIC_TIMEOUT:-100ms}
    PS_SEMANTIC_CACHE_TTL: ${PS_SEMANTIC_CACHE_TTL:-15m}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    
    # Telemetry
    PS_TELEMETRY: ${PS_TELEMETRY:-1}
    PS_TELEMETRY_ENDPOINT: ${PS_TELEMETRY_ENDPOINT:-otel-collector:4317}
    
    # License
    PS_DISABLE_LICENSE: "1"
    PROMPTSHIELD_LICENSE_KEY: ${PROMPTSHIELD_LICENSE_KEY:-}
    # BFF JWT validation (public key)
    PS_BFF_JWT_PUBLIC_KEY: ${PS_BFF_JWT_PUBLIC_KEY}
    PS_BFF_JWT_ISSUER: ${PS_BFF_JWT_ISSUER:-promptshield-bff}
    PS_BFF_JWT_AUDIENCE: ${PS_BFF_JWT_AUDIENCE:-promptshield-gateway}
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/healthz"]
    interval: 30s
    timeout: 3s
    retries: 3
    start_period: 10s
  restart: unless-stopped
  networks:
    - promptshield-net
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

x-envoy-common: &envoy-common
  image: envoyproxy/envoy:v1.28-latest
  volumes:
    - ./deploy/envoy/envoy-cluster.yaml:/etc/envoy/envoy.yaml:ro
  restart: unless-stopped
  networks:
    - promptshield-net
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

services:
  # Frontend BFF (React + Express API server)
  frontend-bff:
    build:
      context: ./frontend/RulepackManager
      dockerfile: Dockerfile.bff
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY}
    environment:
      - NODE_ENV=production
      - PORT=8096
      # Use the same Postgres for app storage and sessions
      - DATABASE_URL=${PS_PG_DSN}
      - PS_PG_DSN=${PS_PG_DSN}
      - PS_TENANT_ID=${PS_TENANT_ID}
      # Sessions: prefer Redis in compose
      - SESSION_STORE=redis
      - REDIS_URL=redis://redis:6379
      - SESSION_COOKIE_SECURE=false
      - PGSSLMODE=require
      # Session + minimal OIDC placeholders to satisfy code paths
      - SESSION_SECRET=${SESSION_SECRET:-change-me-long-random-string-for-production}
      - REPLIT_DOMAINS=localhost
      - REPL_ID=local
      - ISSUER_URL=https://replit.com/oidc
      # BFF -> Go API via internal DNS
      - PS_GATEWAY_URL=http://nginx:80
      # BFF JWT signing (RS256) and claims
      - PS_BFF_JWT_PRIVATE_KEY=${PS_BFF_JWT_PRIVATE_KEY}
      - PS_BFF_JWT_ISSUER=${PS_BFF_JWT_ISSUER:-promptshield-bff}
      - PS_BFF_JWT_AUDIENCE=${PS_BFF_JWT_AUDIENCE:-promptshield-gateway}
      # Clerk Auth
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - CLERK_PUBLISHABLE_KEY=${CLERK_PUBLISHABLE_KEY}
    depends_on:
      - promptshield-1
    expose:
      - "8096"
    restart: unless-stopped
    networks:
      promptshield-net:
        aliases:
          - frontend-bff
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Load Balancer
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"      # API endpoint
      - "8080:8080"  # Enforcement proxy
      - "3000:3000"  # Frontend BFF port
      - "443:443"    # HTTPS (optional)
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/ssl:/etc/nginx/ssl:ro  # SSL certificates
    depends_on:
      - promptshield-1
      - promptshield-2
      - promptshield-3
      - envoy-1
      - envoy-2
      - frontend-bff
    restart: unless-stopped
    networks:
      - promptshield-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # PromptShield instances (scale as needed)
  promptshield-1:
    <<: *promptshield-common
    container_name: promptshield-1
    hostname: promptshield-1
    expose:
      - "9090"
      - "9091"

  promptshield-2:
    <<: *promptshield-common
    container_name: promptshield-2
    hostname: promptshield-2
    expose:
      - "9090"
      - "9091"

  promptshield-3:
    <<: *promptshield-common
    container_name: promptshield-3
    hostname: promptshield-3
    expose:
      - "9090"
      - "9091"

  # Envoy instances for enforcement
  envoy-1:
    <<: *envoy-common
    container_name: envoy-1
    hostname: envoy-1
    expose:
      - "8080"
      - "9901"
    depends_on:
      promptshield-1:
        condition: service_healthy
      promptshield-2:
        condition: service_healthy

  envoy-2:
    <<: *envoy-common
    container_name: envoy-2
    hostname: envoy-2
    expose:
      - "8080"
      - "9901"
    depends_on:
      promptshield-2:
        condition: service_healthy
      promptshield-3:
        condition: service_healthy


  # Redis for session/cache (optional but recommended)
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    expose:
      - "6379"
    restart: unless-stopped
    networks:
      - promptshield-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Monitoring Stack (optional)
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    expose:
      - "9090"
    ports:
      - "9092:9090"  # Prometheus UI
    restart: unless-stopped
    networks:
      - promptshield-net

  grafana:
    image: grafana/grafana:latest
    volumes:
      - ./deploy/monitoring/grafana:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=redis-datasource
    ports:
      - "3100:3000"  # Grafana UI (moved off 3000)
    restart: unless-stopped
    networks:
      - promptshield-net
    depends_on:
      - prometheus

networks:
  promptshield-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  redis-data:
  prometheus-data:
  grafana-data:
